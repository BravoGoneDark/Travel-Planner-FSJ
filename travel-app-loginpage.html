<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel App Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="travel-app-loginpage.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="login-overlay"></div>
  <div class="login-top">
    <span>Don’t have an account?</span>
    <a href="#" class="login-top-link">Create your account</a>
  </div>
  <div class="login-container">
    <div class="login-title">Login</div>
    <form class="login-form">
      <label class="login-label" for="email">Email Address</label>
      <input class="login-input" type="email" id="email" placeholder="praswa@gmail.com" required>
      <div class="login-row">
        <label class="login-label" for="password">Password</label>
        <a href="#" class="forgot-link">Forgot Password?</a>
      </div>
      <input class="login-input" type="password" id="password" placeholder="Enter your password" required>
      <button class="login-btn" type="submit">LOGIN</button>
    </form>
    <div class="login-social">
      <button class="social-btn"><span>Login with</span><i class="fa-brands fa-google-plus-g"></i></button>
      <button class="social-btn"><span>Login with</span><i class="fa-brands fa-facebook-f"></i></button>
    </div>
  </div>
</body>
<script src="travel-app-loginpage.js"></script>
</html>
